<!DOCTYPE html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"> <title>Flippy Chat — revived</title> <script src="/ruffle.js"></script> <style> html, body { margin: 0; height: 100%; background: #0e1a12; overscroll-behavior: none; } #stage { max-width: 800px; width: 100%; height: min(85vh, 900px); margin: 16px auto; touch-action: none; } #stage * { touch-action: none; } h1 { text-align:center; font-family:sans-serif; color:#cde; margin: 12px 0; font-size: 1.2rem; } </style> </head> <body> <h1>Flippy Chat — locally revived</h1> <div id="stage"></div> <script> window.RufflePlayer = window.RufflePlayer || {}; window.addEventListener("DOMContentLoaded", () => { const ruffle = window.RufflePlayer.newest(); const player = ruffle.createPlayer(); const container = document.getElementById("stage"); container.appendChild(player); player.style.width = "100%"; player.style.height = "100%"; player.load({ url: "/chat.swf", parameters: { timePoll: 1500, timeOut: 15000, timeDrop: 60000 } }); }); </script> </body> </html>
